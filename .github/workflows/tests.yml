name: Tests

# 仅在代码或测试工作流变更时触发，文档与发版元数据改动不跑测试。
on:
  push:
    branches: ['**']
    paths:
      - '*.py'
      - '**/*.py'
      - 'web/**'
      - '!web/**/*.md'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - '*.py'
      - '**/*.py'
      - 'web/**'
      - '!web/**/*.md'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
        httpx: ["0.27.2", "0.28.1"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependency
        run: python -m pip install "httpx==${{ matrix.httpx }}"
      - name: Run offline regression tests
        run: python -B -m unittest discover -s tests -v
